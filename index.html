    {name:"Vintage Cars – 6 Car Combo",meta:"Miniatures · Vintage Cars",image:"https://wsrv.nl/?url=https%3A%2F%2Ffancycorner.in%2Fimages%2Fproducts%2Fminiatures%2Fvintage-cars%2FIMG_20261112_003732.HEIC&output=webp&q=86&fit=cover&w=1600&h=1600"},
    {name:"Racing Drift Car",meta:"RC Cars · Racing Drift Car",image:"./images/products/rc-cars/racing-drift-car/IMG_20261115_174158.jpg"}
  ];
  const image=document.getElementById("heroProductImage"),name=document.getElementById("heroProductName"),meta=document.getElementById("heroProductMeta");
  const dots=[...document.querySelectorAll(".hero-six-dot")];
  let index=0,timer;
  function show(i,manual=false){
    index=(i+products.length)%products.length;
    image.classList.add("is-changing");
    setTimeout(()=>{
      image.src=products[index].image;
      image.alt=products[index].name;
      name.textContent=products[index].name;
      meta.textContent=products[index].meta;
      image.classList.remove("is-changing");
    },180);
    dots.forEach((d,n)=>d.classList.toggle("active",n===index));
    if(manual) restart();
  }
  function restart(){clearInterval(timer);timer=setInterval(()=>show(index+1),5200)}
  dots.forEach((d,i)=>d.addEventListener("click",()=>show(i,true)));
  restart();
});
</script></body>
</html>
